services:
  postgres:
    image: postgres:16
    container_name: lancare-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lancare_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-lancare_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancare} -d ${POSTGRES_DB:-lancare_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
