services:
  postgres:
    image: postgres:16
    container_name: lancare-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lancare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lancare_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-lancare_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lancare} -d ${POSTGRES_DB:-lancare_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted AI eKYC Service (replaces FPT.AI)
  # Uses: EasyOCR (Vietnamese OCR), DeepFace (Face Matching), OpenCV (Anti-Fraud)
  ai-ekyc:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: lancare-hub-ai-ekyc
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Models take time to load on first start

volumes:
  postgres_data:

